name: Release
on:
  schedule:
    - cron: "0 0 * * 0" # Every Sunday at midnight
  workflow_dispatch:
    inputs:
      specifier:
        description: "Semver specifier (patch, minor, major) or exact version"
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write # For OIDC trusted publishing

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # Use Nx as the pre-check (fast, and matches your nx.json config).
      # NOTE: the Nx invocation's exit code is captured with `set +e` so its
      # output is always printed before we decide what to do. A previous
      # version redirected output to a file under `bash -e`, which hid the
      # real error and failed the step before `cat` could run (this masked
      # the Nx 23 removal of the `releaseTagPattern` flat property for weeks).
      - name: Check if release is needed (dry-run)
        id: need_release
        run: |
          # Install just enough to run Nx (node_modules persists for later steps)
          bun install --frozen-lockfile

          # Nx --dry-run doesn't modify local files
          set +e
          bunx nx release version --git-tag=false --git-commit=false --dry-run > nx_release_output.txt 2>&1
          NX_STATUS=$?
          set -e
          cat nx_release_output.txt

          if [ "$NX_STATUS" -ne 0 ]; then
            echo "::error::nx release version dry-run failed with exit code $NX_STATUS"
            exit "$NX_STATUS"
          fi

          # Look for indicators that a version bump would occur
          if grep -E 'Resolved the specifier as "(major|minor|patch)"' nx_release_output.txt || \
             grep -E 'Applied version .+ directly' nx_release_output.txt; then
            echo "needs-release=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs-release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: No release needed
        if: steps.need_release.outputs.needs-release == 'false'
        run: |
          echo "Nx release dry-run produced no changes. Skipping remaining steps."

      - name: Build
        if: steps.need_release.outputs.needs-release == 'true'
        run: bun run build

      - name: Configure Git
        if: steps.need_release.outputs.needs-release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Release Packages
        if: steps.need_release.outputs.needs-release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          NPM_CONFIG_REGISTRY: "https://registry.npmjs.org"
          RELEASE_SPECIFIER: ${{ github.event.inputs.specifier }}
        run: |
          # An empty specifier input (scheduled runs) must be omitted, not
          # passed as an empty string — Nx rejects `nx release ""`.
          if [ -z "$RELEASE_SPECIFIER" ]; then
            bunx nx release --yes --verbose
          else
            bunx nx release "$RELEASE_SPECIFIER" --yes --verbose
          fi
