# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2
updates:
  # Enable version updates for github actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  # Enable version updates for go
  # - package-ecosystem: gomod
  #   directory: "/"
  #   schedule:
  #     interval: "monthly"

  # Enable version updates for npm
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "monthly"
    # All @nx/* packages must move as one group on the same major as `nx`.
    # A lone @nx/expo v23 bump on a v22 workspace (see #146) broke every
    # `nx run-many` invocation, because @nx/devkit@23 re-exports
    # `workspaceDataDirectory` from nx core, which does not exist on v22.
    groups:
      nx:
        patterns: ["@nx/*", "nx"]
        update-types: ["major", "minor", "patch"]

  # Enable version updates for Docker
  # - package-ecosystem: "docker"
  #   directory: "/"
  #   schedule:
  #     interval: "monthly"

  # Enable version updates for Dart
  # - package-ecosystem: "pub"
  #   directory: "/"
  #   schedule:
  #     interval: "monthly"
